<html lang="en">

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

      property="og:image:alt"

      :root {

      }

      body {
        background: radial-gradient(
          120% 120% at 50% 40%,
          #0d1426 0%,
          #080d1a 55%,
          #05080f 100%
        );
        overflow: hidden;
        display: grid;
        place-items: center;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        cursor: pointer;
      }
      #stage {
        display: block;
