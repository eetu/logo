<!doctype html>
<!--
  ❄ reading the source. naturally.
  the mark hides more than it shows —
    a colour key · an old console code · a halo drawn by hand ·
    a smash that melts it · two pokes that drill · S for the dials.
  → github.com/eetu/logo
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>invinite — frozen mark</title>
    <meta
      name="description"
      content="The invinite gear mark as animated frozen ASCII: frost, rotating ice highlights and cryo-vapour on a canvas. Click it."
    />
    <!-- Served at both invinite.tech and logo.invinite.tech; the apex is the one
         address search engines and link previews should keep. -->
    <link rel="canonical" href="https://invinite.tech/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://invinite.tech/" />
    <meta property="og:site_name" content="invinite.tech" />
    <meta property="og:title" content="invinite — frozen mark" />
    <meta
      property="og:description"
      content="The invinite gear mark as animated frozen ASCII. Click it."
    />
    <!-- Absolute: link-preview crawlers do not resolve a relative image URL. -->
    <meta property="og:image" content="https://invinite.tech/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The invinite gear mark drawn in frosted ASCII on a dark blue background"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1020" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* block Safari swipe-back/forward, pull-to-refresh and scroll so
           draw-gestures (circle / swipes) aren't hijacked by the browser */
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        background: radial-gradient(
          120% 120% at 50% 40%,
          #0d1426 0%,
          #080d1a 55%,
          #05080f 100%
        );
        overflow: hidden;
        display: grid;
        place-items: center;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        cursor: pointer;
      }
      #stage {
        display: block;
        touch-action: none;
      }

      /* --- projects on invinite.tech (showcase.js) ------------------------ */
      :root {
        --ice: #cfe0f5;
        --ice-dim: #7f93b5;
        --ice-glow: rgba(120, 180, 255, 0.55);
      }
      body[data-theme="light"] {
        --ice: #2b3a55;
        --ice-dim: #56627a;
        --ice-glow: rgba(255, 255, 255, 0.9);
      }
      .orbit,
      .projects {
        opacity: 0;
        animation: appear 1.6s ease-out 3.2s forwards; /* after the frost-in */
      }
      @keyframes appear {
        to {
          opacity: 1;
        }
      }
      /* Separate `translate` / `scale` properties, so the bob and the hover
         zoom do not overwrite each other or the position set from script. */
      @keyframes bob {
        50% {
          translate: 0 -4px;
        }
      }

      /* A full-screen layer the shards are positioned in (showcase.js). */
      .orbit {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .shard {
        position: absolute;
        left: 0;
        top: 0;
        /* a 44 px hit area centred on the orbit point */
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        display: grid;
        place-items: center;
        pointer-events: auto;
        text-decoration: none;
        color: var(--ice);
        will-change: transform;
        -webkit-tap-highlight-color: transparent;
      }
      .glyph {
        font-size: 20px;
        text-shadow: 0 0 10px var(--ice-glow);
        animation: bob 5s ease-in-out infinite;
        transition:
          scale 0.3s,
          text-shadow 0.3s;
      }
      .label {
        position: absolute;
        white-space: nowrap;
        font-size: 12px;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 0.3s;
        text-shadow: 0 0 8px var(--ice-glow);
      }
      .label[data-side="below"] {
        top: 36px;
      }
      .label[data-side="above"] {
        bottom: 36px;
      }
      .label[data-side="right"],
      .label[data-side="left"] {
        top: 50%;
        translate: 0 -50%;
      }
      .label[data-side="right"] {
        left: 38px;
      }
      .label[data-side="left"] {
        right: 38px;
      }
      /* .lit: this shard or its list entry is hovered, focused, or was tapped
         once on a touch screen (showcase.js). */
      .shard.lit .glyph {
        scale: 1.5;
        text-shadow:
          0 0 14px var(--ice-glow),
          0 0 28px var(--ice-glow);
      }
      .shard.lit .label {
        opacity: 1;
      }

      /* The frosted list along the bottom: the accessible copy of the links. */
      .projects {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        padding: 0 16px;
        pointer-events: none;
      }
      .projects ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 32px;
      }
      .projects a {
        pointer-events: auto;
        display: grid;
        justify-items: center;
        gap: 2px;
        padding: 6px 4px;
        text-decoration: none;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
      }
      .projects .title {
        color: var(--ice);
        font-size: 14px;
        letter-spacing: 0.05em;
        text-shadow: 0 0 10px var(--ice-glow);
      }
      .projects .desc {
        color: var(--ice-dim);
        font-size: 11.5px;
        max-width: 34ch;
      }
      .projects a.lit .title,
      .projects a:focus-visible .title {
        text-shadow:
          0 0 12px var(--ice-glow),
          0 0 24px var(--ice-glow);
      }
      .projects a:focus-visible {
        outline: 1px dashed var(--ice-dim);
        outline-offset: 2px;
      }
      /* Set by showcase.js when the full list would take over a quarter of the
         screen: titles only, in wrapping rows. */
      .projects.compact .desc {
        display: none;
      }
      .projects.compact ul {
        gap: 2px 20px;
      }
      /* Short landscape screens (a phone on its side): the mark fills the
         height, so the list moves to the right edge as a column, titles only.
         showcase.js sees where the list is and keeps the orbit clear of it. */
      @media (max-height: 520px) and (orientation: landscape) {
        .projects .desc {
          display: none;
        }
        .projects {
          left: auto;
          right: calc(env(safe-area-inset-right, 0px) + 16px);
          bottom: auto;
          top: 50%;
          translate: 0 -50%;
          padding: 0;
        }
        .projects ul {
          flex-direction: column;
          align-items: flex-end;
          gap: 4px;
        }
        .projects a {
          justify-items: end;
          text-align: right;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit,
        .projects {
          animation: none;
          opacity: 1;
        }
        .glyph {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/main.js"></script>
    <script type="module" src="/showcase.js"></script>
  </body>
</html>
