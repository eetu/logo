<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />

    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* block Safari swipe-back/forward, pull-to-refresh and scroll so

        touch-action: none;
      }
      body {
        background: radial-gradient(
          120% 120% at 50% 40%,
          #0d1426 0%,
          #080d1a 55%,
          #05080f 100%
        );
        overflow: hidden;
        display: grid;
        place-items: center;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        cursor: pointer;
      }
      #stage {
        display: block;
        touch-action: none;
      }
