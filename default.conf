server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
    }

    # nginx's stock mime.types has no mapping for .webmanifest, so it falls back
    # to application/octet-stream. Serve it with the correct PWA media type.
    location = /assets/site.webmanifest {
        default_type application/manifest+json;
    }
}
